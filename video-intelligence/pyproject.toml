[project]
name = "video-intelligence"
version = "0.3.0"
description = "Batch video intelligence on NVIDIA DGX Spark (Phase 1-3): DeepStream + YOLO + RabbitMQ + PostgreSQL"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "python-multipart>=0.0.9",
    "pydantic>=2.7",
    "pydantic-settings>=2.3",
    "psycopg[binary]>=3.2",
    "psycopg-pool>=3.2",
    "pika>=1.3",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "ruff>=0.5", "mypy>=1.10"]
# Only needed for scripts/benchmark_yolo_baseline.py and scripts/export_yolo.py
yolo = ["ultralytics", "onnx"]

[tool.setuptools.packages.find]
include = ["shared*", "services*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = [
    "integration: needs PostgreSQL (and optionally RabbitMQ)",
    "rabbitmq: needs a real RabbitMQ (RABBITMQ_URL)",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "SIM"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
check_untyped_defs = true
