# A job can legitimately hold its message for hours (1h+ videos). RabbitMQ's DEFAULT
# consumer_timeout is 30 minutes and closes the channel when an ack is overdue, which would
# redeliver a healthy long-running job. 24 h here; the lease/heartbeat in PostgreSQL is the real
# liveness check, not this timeout.
consumer_timeout = 86400000

heartbeat = 30
# Keep the broker from filling the disk silently.
disk_free_limit.absolute = 5GB
vm_memory_high_watermark.relative = 0.15
loopback_users.guest = true
log.console.level = info
